workflows:
  android-release:
    name: SEARCH-POI Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: com.archpoi.searchpoi
        NODE_OPTIONS: --openssl-legacy-provider
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
        
      - name: Install Capacitor CLI
        script: npm install -D @capacitor/core @capacitor/android @capacitor/cli
        
      - name: Build web app
        script: npm run build
        
      - name: Create capacitor.config.ts
        script: |
          echo 'import { CapacitorConfig } from "@capacitor/cli";
          const config: CapacitorConfig = {
            appId: "com.archpoi.searchpoi",
            appName: "SEARCH-POI",
            webDir: "dist",
            bundledWebRuntime: false
          };
          export default config;' > capacitor.config.ts
        
      - name: Add Android Platform
        script: npx cap add android || npx cap sync android
        
      - name: Fix Kotlin duplicates
        script: |
          cd android
          echo 'configurations.all {
            resolutionStrategy {
              force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
            }
          }' >> app/build.gradle
        
      - name: Sync Capacitor
        script: npx cap sync android
        
      - name: Build debug APK
        script: cd android && ./gradlew assembleDebug
        
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
