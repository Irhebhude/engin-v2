workflows:
  android-release:
    name: SEARCH-POI Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: com.archpoi.searchpoi
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
        
      - name: Build web app
        script: npm run build
        
      - name: Add Capacitor Android
        script: npx cap add android || echo "Android already added"
        
      - name: Sync Capacitor
        script: npx cap sync android
        
      - name: Build debug APK
        script: cd android && ./gradlew assembleDebug
        
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
